# Runs the ExamX web UI on 127.0.0.1:8014 (host network, so it can reach Ollama on localhost:11434).
# exam-x.vrp2206.com reaches it through its own Cloudflare Tunnel (the "tunnel" service below), whose public
# hostname is set in the Cloudflare dashboard to http://localhost:8014.
# Secrets never live in this file: the tunnel token is read from ~/.examx-tunnel.env (TUNNEL_TOKEN=...) and an
# optional server-wide API key from ~/.examx.env, both outside the repo and chmod 600, created by the owner.
services:
  examx:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    network_mode: host
    env_file:
      - path: ${HOME}/.examx.env
        required: false
    environment:
      # Public site: visitors (requests via Cloudflare) use only their own API keys, see only their own papers,
      # and are limited per IP. Set EXAMX_REQUIRE_ACCESS=1 to require Cloudflare Access sign-in instead.
      - EXAMX_PUBLIC_DAILY_JOBS=20    # papers + markings per visitor IP per day
      - EXAMX_PUBLIC_DAILY_TOTAL=300  # all visitors together, per day
      - EXAMX_DAILY_AI_JOBS=150       # public AI jobs per day (they use visitors' own keys)
      - EXAMX_MODEL=claude:claude-sonnet-5-5
    volumes:
      - ../output:/app/output

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    network_mode: host
    command: tunnel --no-autoupdate --metrics 127.0.0.1:20242 run
    env_file:
      - path: ${HOME}/.examx-tunnel.env
        required: true
    depends_on:
      - examx
