[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "examx"
version = "0.1.0"
description = "FIT2014 practice-paper generator and grader using a local LLM"
requires-python = ">=3.10"
dependencies = ["pymupdf>=1.24", "requests>=2.31", "markdown>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
examx = "examx.cli:main"

[tool.setuptools]
packages = ["examx", "examx.checkers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
